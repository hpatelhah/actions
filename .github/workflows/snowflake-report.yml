## **Phase 2: Set Up GitHub**

### **Step 2.1: Create GitHub Account (if you don't have one)**

1. Go to [github.com](https://github.com)
2. Click **Sign up**
3. Enter your email, password, username
4. Verify your email
5. Complete the setup

### **Step 2.2: Create a New Repository**

1. **Go to:** [github.com/new](https://github.com/new)

2. **Fill in the details:**
```
   Repository name: snowflake-automation
   Description: Automated Snowflake reporting to Excel
   
   ⚪ Public  (anyone can see)
   🔘 Private (recommended for work projects)
   
   ☑️ Add a README file (optional)
```

3. **Click:** `Create repository`

You'll see a page like this:
```
Quick setup — if you've done this kind of thing before
